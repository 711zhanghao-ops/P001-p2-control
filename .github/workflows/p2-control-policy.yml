name: P2 Control Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-control-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy code from base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Run read-only control policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: python tools/p2_control_policy.py
